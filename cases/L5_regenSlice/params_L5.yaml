numerics:
  dt_s: 1.8115942e-5           # 2400 steps per cycle (the local line's measurement-backed choice)
  mesh:
    matrix: 120 cells of 0.43333 mm (cell FACES on the 121 comparison nodes)
    hx: 10 cells of 0.5 mm each side
    chambers: cells of ~0.5 mm at mean volume
  run_length_cycles: ">= 40 from the given initial state, then until bar B6 holds"
  sensitivity_check: restart the converged state, halve dt (4800 steps/cycle) AND halve
    the matrix dx, run >= 5 cycles - the B1/B2 quantities must move < 1 %.

acceptance_bars:
  # Code-to-code, ltneFoam vs the leader's local Fluent twin. PREREGISTERED - this file
  # is the prereg. The PR that runs L5 quotes these bars UNCHANGED before any run is
  # submitted; a FAIL is recorded as a FAIL.
  B1_face_phasors: at both matrix faces, cycle-fitted |p| and |mdot| within 3 %, phases
    within 3 deg
  B2_dp_amplitude: cycle-fitted dp amplitude across the matrix within 5 %
  B3_enthalpy_flow: cycle-mean total enthalpy + conduction flux <H> at the two faces and
    the joint within max(5 %, 0.1 W)
  B4_temperature_profile: cycle-mean Tg(z) at the 121 nodes, max |delta T| < 2 K
  B5_energy_closure: EACH code separately - the cycle-mean boundary energy flows (piston
    work in, HX solid heat out) close to < 0.15 W (1 % of the hot-face Edot)
  B6_periodicity: last 5 cycles - |d(cycle-mean T at the joint)/d(cycle)| < 0.1 K and the
    relative drift of the matrix <H> < 2 % per cycle

deliverables:                  # in the L5 PR (small CSVs, per docs/TASK.md job rules)
  - "per_cycle.csv: cycle, cycle-mean T at the joint, <H> at the 3 stations, fitted dp
     amplitude, fitted face phasors (|p|, Ph, |mdot|, Ph at both faces)"
  - "final_cycle_faces.csv: t, p, u_superficial, mdot, Tg at both matrix faces, every step"
  - "profiles.csv: cycle-mean Tg(z) and Ts(z) at the 121 nodes, final cycle"
  - "piston_check.csv: realized piston volume-flow phasor vs this spec (the 0.5 % check)"
  - "logs trimmed per repo rules; README status row; results/L5/ layout as L4"

leader_side_note: the leader runs the Fluent twin locally from THIS file and performs the
  B1-B6 comparison; the cloud PR is judged on bars-before-runs discipline, the sensitivity
  check, the B5/B6 self-checks, and the deliverables being complete and reproducible.
