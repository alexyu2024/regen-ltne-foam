# =====================================================================================
# L5 parameter file - oscillating regenerator slice (Huang 2020 low-temperature regenerator)
# Provided by the leader per docs/TASK.md (L5). 2026-09-27.
#
# PROVENANCE. Geometry and screens: Huang et al., Int. J. Refrigeration 111 (2020) 29-38,
# Table 1 (52 x 28 mm low-temperature regenerator, 635# + 500# stainless screens, 23 Hz,
# 0.75 MPa) with the two [ASSUME]d wire diameters noted below. Drive and targets: the
# leader's local DeltaEC replica of that machine (joined whole-machine model, Err 5.9e-11,
# reproducing the paper's Sage Table 3 station values). Correlations: Sage v13 manual
# (Gedeon & Wood screens) and DeltaEC Users Guide property fits. Everything in this file
# is published data or standard published correlations - nothing proprietary.
#
# CONVENTION. Every oscillating quantity is x(t) = x_mean + |x| * cos(omega*t + Ph_deg),
# Ph in degrees, ONE common phase frame (only phase differences are physical). The axial
# coordinate z runs hot -> cold with z = 0 at the matrix hot face.
#
# WHAT L5 IS. Two codes run THIS same model - ltneFoam here, Fluent locally by the leader:
# same layout, correlations, drive, initial state, numerics. The PASS bars are
# code-to-code (B1-B6). DeltaEC values are context only (a different model class), never
# a pass criterion.
# =====================================================================================

case: L5_regenSlice

operating_point:
  frequency_Hz: 23.0
  omega_rad_s: 144.51326206513048
  mean_pressure_Pa: 750000.0
  gravity: "off"
  turbulence: laminar          # Re_ref ~ 40-54 on the wire scale (see porous_matrix)

