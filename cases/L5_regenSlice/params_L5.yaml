solids:
  matrix_material: stainless_steel
  # DeltaEC Users Guide section 13.5 fits (valid 6-1300 K), used verbatim by both codes:
  #   rho_ss(T) = 7993 - (0.3*T + 8e-5*T^2) * T^2 / (20000 + T^2)                [kg/m3]
  #   k_ss(T)   = (266800*T^-5.2 + 0.21416*T^-1.6)^-0.25                         [W/(m K)]
  #   cp_ss(T)  = (1.7054e-6*T^-0.88962 + 23324*T^-6)^(-1/3) + 15/T - 35/T^2 + 25/T^3  [J/(kg K)]
  # rho_ss may be held constant at 7990 kg/m3 (< 1 % band over 18-90 K) where a code
  # cannot table a solid density.
  hx_material: copper          # DeltaEC 13.3: rho 9000, cp 420, k = 398 - 0.0567*(T - 300)
  # PHYSICAL effective properties of the screen matrix, per unit TOTAL volume:
  #   axial solid conduction: k_eff(T) = ksFrac * (1 - eps) * k_ss(T), ksFrac = 0.10
  #     (stacked-screen contact resistance, DeltaEC Users Guide 10.5.2 / Lewis 1998;
  #      the DeltaEC model runs the same 0.10)
  #   solid heat capacity: (1 - eps) * rho_ss(T) * cp_ss(T)
  # Each code enters whatever ITS OWN solid equation needs to realize exactly these
  # physical values and DOCUMENTS the mapping in its README. (Fluent example: its solid
  # equation already carries (1-eps) on both terms, so it is fed ksFrac*k_ss and bulk
  # rho*cp. State the ltneFoam equivalent explicitly.)
  ksFrac: 0.10

layout:                        # 1-D axial column, uniform cross-section
  area_m2: 6.1575e-4           # full 28 mm bore; any cross-section works if every
                               # per-area quantity is preserved
  zones:                       # [z_from_m, z_to_m] measured from the MATRIX HOT FACE
    hot_chamber:  { z: [-0.017, -0.005], gas_only: true, walls: adiabatic }
    hot_hx:       { z: [-0.005,  0.000], porous: hx, solid_T_fixed_K: 80.033 }
    matrix_500:   { z: [ 0.000,  0.026], porous: screen_500 }
    matrix_635:   { z: [ 0.026,  0.052], porous: screen_635 }
    cold_hx:      { z: [ 0.052,  0.057], porous: hx, solid_T_fixed_K: 21.997 }
    cold_chamber: { z: [ 0.057,  0.061], gas_only: true, walls: adiabatic }
  # Chamber mean gas lengths: hot 12 mm, cold 4 mm. The pistons sweep +-5.82 / +-2.01 mm
  # about the chamber outer ends (min residual gas column 6.2 / 2.0 mm).

porous_matrix:
  # Gedeon & Wood woven screens, Sage v13 eqs (18.4/18.5/20.8-20.10), superficial form.
  # Formulas (beta = porosity, dw = wire diameter, u_sup = superficial velocity):
  #   d_re    = dw/(1-beta)                 Reynolds length: Re = rho*|u_sup|*d_re/mu
  #   d_h     = beta*dw/(1-beta)            heat-transfer length
  #   a_sf    = 4*(1-beta)/dw               wetted area per unit canister volume
  #   1/alpha = 129*(1-beta)^2/(2*beta^3*dw^2)          Darcy (viscous) resistance
  #   C2      = 2.91*Re_ref^-0.103*(1-beta)/(beta^3*dw) Forchheimer (inertial)
  #   Nu      = (1 + 0.99*Pe^0.66)*beta^1.79 ; Pe = Re*Pr ; h_sf = Nu*k_gas(T)/d_h
  # Momentum sink: dp/dz = -(mu/alpha)*u_sup - C2*0.5*rho*u_sup^2.
  # C2 is evaluated ONCE at the reference state below and held constant (as the local
  # code does); h_sf is a live field via the Nu formula. Mixing d_re and d_h is the
  # classic error here - Re uses d_re, h_sf divides by d_h.
  reference_state:
    T_ref_K: 51.015            # mean of the two face temperatures
    rho_ref_kg_m3: 7.0772      # p_m / (R * T_ref)
    mu_ref_Pa_s: 6.56191e-06   # CoolProp helium (T_ref, p_m)
    v_ref_m_s: 0.77095         # peak superficial velocity, hot face (drive table)
  screen_500:                  # warm half; 500 mesh, wire 24 um [ASSUME, as DeltaEC model]
    dw_m: 2.4e-5
    porosity: 0.6289
    d_re_m: 6.4673e-5
    d_h_m: 4.0673e-5
    a_sf_m1: 61850.0
    inv_alpha_m2: 6.19975e+10
    Re_ref: 53.77
    C2_m1: 1.19999e+5
    nu_beta_factor: 0.43597    # beta^1.79 in the Nu formula
  screen_635:                  # cold half; 635 mesh, wire 20 um [ASSUME, as DeltaEC model]
    dw_m: 2.0e-5
    porosity: 0.6073
    d_re_m: 5.0929e-5
    d_h_m: 3.0929e-5
    a_sf_m1: 78540.0
    inv_alpha_m2: 1.11023e+11
    Re_ref: 42.35
    C2_m1: 1.73441e+5
    nu_beta_factor: 0.40954

porous_hx:                     # idealized isothermal heat exchangers ([ASSUME]d slit
  porosity: 0.70               # geometry as in the DeltaEC model)
  d_h_m: 2.0e-4
  a_sf_m1: 1.0e5
  inv_alpha_m2: 1.0e5          # nominal - negligible dp on purpose
  C2_m1: 1.0e-5
  Nu_formula: "max(2.0, 2.0 + 1.1 * Re^0.6 * Pr^(1/3))"  # Wakao-type; Re on d_h, superficial
  solid_note: copper; solid temperature FIXED (hot 80.033 K / cold 21.997 K). The HX
    solid is the model's only thermal anchor - chamber and matrix walls are adiabatic.

drive:                         # two pistons, x(t) = |x| * cos(omega*t + Ph)
  # Derivation: the DeltaEC face volume-flow phasors (face_targets below) corrected for
  # the compressibility of the gas column between each piston and its matrix face
  # (adiabatic chamber V_ch/(gamma*p_m) + isothermal HX gas V_hx_gas/p_m):
  #   U_piston = U_face + j*omega*[V_ch/(gamma*p_m) + V_hx_gas/p_m]*p_face  (hot: sign +;
  #   the cold piston ABSORBS the machine's +z flow: sign -)
  # Piston displacement xi toward the matrix reduces the chamber: U_p = A*dxi/dt, so
  # |xi| = |U_p|/(A*omega) and Ph(xi) = Ph(U_p) - 90 deg.
  hot_piston:
    U_amp_m3_s: 5.17850e-4
    U_phase_deg: 34.1095
    displacement_amp_m: 5.81958e-3
    displacement_phase_deg: -55.8905
  cold_piston:
    U_amp_m3_s: 1.78560e-4
    U_phase_deg: -39.2630
    displacement_amp_m: 2.00665e-3
    displacement_phase_deg: -129.2630
  implementation: moving wall/mesh or an equivalent verified source model - the code's
    choice, documented. The REALIZED piston volume flow must match this spec within
    0.5 % in amplitude and 0.5 deg in phase (report the check - piston_check.csv).

face_targets_deltaec_context:  # context from the DeltaEC replica - NOT pass bars
  matrix_hot_face:
    T_K: 80.033
    p_amp_Pa: 67505.9
    p_phase_deg: -0.3025
    U_amp_m3_s: 0.000474712
    U_phase_deg: 25.5443
    mdot_amp_kg_s: 0.00214156
    u_superficial_amp_m_s: 0.770949
    Htot_W: 1.8275
    Edot_W: 14.4200
  joint_500_635:
    T_K: 28.036
    p_amp_Pa: 59191.1
    p_phase_deg: -3.1448
    U_amp_m3_s: 0.0001669
    U_phase_deg: 2.5845
    mdot_amp_kg_s: 0.00214936
    u_superficial_amp_m_s: 0.271051
    Htot_W: 1.8275
    Edot_W: 4.9149
  matrix_cold_face:
    T_K: 21.997
    p_amp_Pa: 52775.8
    p_phase_deg: -1.8925
    U_amp_m3_s: 0.000158873
    U_phase_deg: -28.6135
    mdot_amp_kg_s: 0.00260769
    u_superficial_amp_m_s: 0.258016
    Htot_W: 1.8275
    Edot_W: 3.7447
  derived:
    dp_amp_across_matrix_Pa: 14730.2
    p_amp_ratio_hot_over_cold: 1.2791
    mdot_amp_spread_pct: 23.6  # rho*|U| is NOT constant along the matrix (|p|/p_m ~ 0.09)
  cautions:
    - "phases: compare a CFD matrix-cold-face result against station 4; the paper's
       theta_c = -39.6 deg is quoted 5 mm further on (CHX exit), 6.6 deg away."
    - "the DeltaEC model carries NO time-averaged pressure difference along the machine
       (p2,0,DEC = 0 everywhere): compare the dp AMPLITUDE and waveform, never the mean."

